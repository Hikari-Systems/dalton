# Default values of the security headers dalton adds to every response
# (snippets/security-headers.conf). A site overrides one by setting its
# variable at server or location level, before any `return`:
#     set $dalton_csp "default-src 'self'; script-src 'self' 'unsafe-inline'";
# An empty value means dalton adds no such header.
map $host $dalton_csp  { default "default-src 'self'; frame-ancestors 'none'"; }
map $host $dalton_xfo  { default "DENY"; }
map $host $dalton_hsts { default "max-age=63072000; includeSubDomains; preload"; }

# Header always unset Server: server_tokens off alone still sends
# "Server: nginx", and an upstream's own Server header is dropped too.
more_clear_headers Server;
