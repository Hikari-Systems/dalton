# Apache's DocumentRoot (/usr/local/apache2/htdocs): the "It works!" page.
# Used inside `location /` by the default server, and by vhosts for paths no
# ProxyPass covered (a 404). Apache's FilesMatch denies applied only to these
# filesystem-served paths (proxied requests skip <Files>), so they live here.
# They're an `if`, not nested locations: nested regex locations would be
# matched before the server's own regex locations (e.g. /.well-known/...).
root  /usr/share/nginx/html;
index index.html;
if ($uri ~ "(^|/)\.|\.(bak|backup|swp|tmp)$") { return 403; }
