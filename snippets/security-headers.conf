# Security headers on every response, whatever its status (Apache:
# `Header always set` in security.conf). Like Apache's, they are ADDED: an
# upstream's own Content-Security-Policy or X-Frame-Options is kept beside
# dalton's, and the browser enforces both.
#
# Included once at http level. nginx drops inherited add_header directives in
# any block that has its own, so a server or location that uses add_header
# must include this file again in that same block.
add_header Content-Security-Policy   $dalton_csp always;
add_header X-Frame-Options           $dalton_xfo always;
add_header Strict-Transport-Security $dalton_hsts always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-XSS-Protection          "1; mode=block" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
