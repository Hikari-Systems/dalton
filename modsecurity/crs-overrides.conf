# dalton's CRS adjustments, loaded after crs-setup.conf and before the rules.
#
# Everything stays at the CRS 4 defaults: paranoia level 1, inbound anomaly
# threshold 5, outbound 4, allowed methods GET HEAD POST OPTIONS. Paths that
# need other methods remove 911100 in their own site file, as they did under
# Apache, and paths ModSecurity must not touch set `modsecurity off;`.
#
# Server-sent events (text/event-stream) are long-lived streams that must never
# be buffered. They are outside SecResponseBodyMimeType (text/plain text/html
# text/xml, in modsecurity.conf), so ModSecurity never holds them; keep it that
# way if that list is ever changed. (libmodsecurity v3 has no
# ctl:responseBodyAccess to switch it off per response.)
