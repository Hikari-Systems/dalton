# dalton's CRS adjustments, loaded after crs-setup.conf and before the rules.
#
# Everything stays at the CRS 4 defaults: paranoia level 1, inbound anomaly
# threshold 5, outbound 4, allowed methods GET HEAD POST OPTIONS. Paths that
# need other methods remove 911100 in their own site file, as they did under
# Apache, and paths ModSecurity must not touch set `modsecurity off;`.
#
# Server-sent events (text/event-stream) are long-lived streams that must never
# be buffered. They are outside SecResponseBodyMimeType (text/plain text/html
# text/xml, in modsecurity.conf), so ModSecurity never holds them; keep it that
# way if that list is ever changed. (libmodsecurity v3 has no
# ctl:responseBodyAccess to switch it off per response.)

# ---------------------------------------------------------------- protocol bodies
# Two JSON protocols carry content CRS reads as attacks, measured by replaying
# every GraphQL operation in the UIs behind dalton (224) and realistic Claude
# Code MCP calls through CRS 4.30 at PL1 with blocking on (2026-11-15):
#
# MCP (JSON-RPC over POST /mcp). Every Claude Code call carries
# params._meta.claudecode/... and claudeai/... argument NAMES, which 930120
# (OS file access) matches on ".claude"; that blocked 60 of 80 calls. Tool
# arguments are free-form by design: boolean study searches ("AND (NSCLC OR
# lung)") hit 942100, Cypher patterns ("(a)-[:KNOWS]->(b)") 932130, prose
# with "; replace" 932235/932370/942350. They are passed to the MCP servers,
# which validate them against each tool's schema; none are run in a shell or
# concatenated into SQL. So on /mcp CRS doesn't read the JSON-RPC body at all
# (libmodsecurity 3.0.17 can't remove a regex-named target with ctl, and tool
# argument names differ per tool); headers, URI, query string and method are
# still inspected, and the MCP servers authenticate every call.
SecRule REQUEST_FILENAME "@rx ^/mcp(?:/|$)" \
    "id:1000101,phase:1,pass,nolog,t:none,ctl:requestBodyAccess=Off"
#
# GraphQL (POST /api/graphql, /api/open-graphql). The query document is
# GraphQL syntax, not user input: its $variables hit 942290 (MongoDB
# operators) and field names such as make, patch and export hit 932235 (Unix
# commands); that blocked 19 of 224 real operations. CRS doesn't inspect
# json.query there; json.variables.*, where the user's input travels, still is.
SecRule REQUEST_FILENAME "@rx ^/api/(?:open-)?graphql$" \
    "id:1000102,phase:1,pass,nolog,t:none,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.query"
