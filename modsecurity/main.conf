# ModSecurity rules for every vhost (nginx.conf: modsecurity_rules_file).
# Sites adjust per location with `modsecurity_rules 'SecRuleRemoveById …';`
# or take a path out entirely with `modsecurity off;`.

# Engine settings (body access, limits, audit log, the 2000xx parser rules).
Include /etc/modsecurity/modsecurity.conf
# SecRuleEngine On|DetectionOnly|Off, from MODSEC_RULE_ENGINE.
Include /tmp/modsecurity/engine.conf

# OWASP Core Rule Set, in the order CRS 4 documents (plugins around the rules).
Include /usr/local/coreruleset/crs-setup.conf
Include /etc/modsecurity/crs-overrides.conf
Include /usr/local/coreruleset/plugins/*-config.conf
Include /usr/local/coreruleset/plugins/*-before.conf
Include /usr/local/coreruleset/rules/*.conf
Include /usr/local/coreruleset/plugins/*-after.conf
