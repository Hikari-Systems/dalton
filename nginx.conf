# dalton: nginx + ModSecurity v3 + OWASP CRS, behind AWS ALB (and CloudFront).
#
# The ALB sends every host to :3000 here; the spot repo's sites (rendered from
# /etc/nginx/templates into /tmp/nginx/sites-enabled by docker-entrypoint.sh)
# route by Host to the controllers. The container is read_only: everything
# nginx writes lives under /tmp (a tmpfs in the fleets' compose).
#
# Replaces the Apache image's httpd-nonroot.conf + security.conf. Where a
# setting maps one-to-one, the Apache directive is named beside it.

load_module modules/ngx_otel_module.so;
load_module modules/ngx_http_modsecurity_module.so;
load_module modules/ngx_http_headers_more_filter_module.so;

# Run as the image's non-root user: no `user` directive (ignored when not root).
pid /tmp/nginx/nginx.pid;
# Apache: event MPM, MaxRequestWorkers 200.
worker_processes auto;
worker_rlimit_nofile 8192;
error_log /dev/stderr notice;

events {
    worker_connections 2048;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ---------------------------------------------------------------- paths
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    # ---------------------------------------------------------------- logging
    # Apache's combined_with_forwarded, field for field, plus the trace id so a
    # log line finds its trace in SigNoz ("-" when the request wasn't sampled).
    log_format combined_with_forwarded
        '$remote_addr - $remote_user [$time_local] "$request" $status $bytes_sent '
        '"$http_referer" "$http_user_agent" "$http_x_forwarded_for" "$http_x_forwarded_proto" '
        'trace_id=$otel_trace_id';
    access_log /dev/stdout combined_with_forwarded;

    # ---------------------------------------------------------------- server
    server_tokens off;                  # ServerTokens Prod / ServerSignature Off
    sendfile      on;
    tcp_nopush    on;
    gzip          off;                  # Apache had no mod_deflate; SSE must not be compressed-and-held
    keepalive_timeout  5;               # KeepAliveTimeout 5
    keepalive_requests 1000;            # MaxKeepAliveRequests 1000
    client_header_timeout 30s;          # Timeout 30
    client_body_timeout   30s;
    send_timeout          30s;
    reset_timedout_connection on;
    # Redirects nginx makes or rewrites (proxy_redirect) stay relative, so
    # they never carry http:// or the container's :3000 behind CloudFront.
    absolute_redirect off;
    port_in_redirect  off;
    large_client_header_buffers 4 8k;   # LimitRequestLine / LimitRequestFieldSize 8190
    client_header_buffer_size 1k;
    # LimitRequestBody 10 MiB, aligned with ModSecurity's SecRequestBodyLimit
    # (13107200). Unlike Apache, nginx enforces this on proxied bodies, with or
    # without a Content-Length. Sites raise it per path where a controller
    # accepts more (each sits 64 KiB above the controller's own cap).
    client_max_body_size 13107200;
    # Bodies up to SecRequestBodyInMemoryLimit stay in memory; larger ones spool
    # to /tmp/nginx/client_body.
    client_body_buffer_size 128k;
    # No LimitRequestFields equivalent exists in nginx; header size is still
    # bounded by large_client_header_buffers above.

    # Upstream names are re-resolved at run time (`server … resolve` in each
    # site's upstream blocks), so a controller that isn't running yet doesn't
    # stop dalton starting (Apache resolved per request). docker-entrypoint.sh
    # writes the container's own resolver (podman's aardvark-dns or docker's).
    include /tmp/nginx/resolver.conf;
    resolver_timeout 5s;

    # ---------------------------------------------------------------- client IP
    # mod_remoteip: trusted ALB / private / CloudFront hops are peeled off
    # X-Forwarded-For; $remote_addr is the first untrusted one.
    include /etc/nginx/dalton/realip-cloudfront.conf;

    # ---------------------------------------------------------------- proxy defaults
    # ProxyPass … disablereuse=on keepalive=off: HTTP/1.1, a new connection per
    # request (no upstream keepalive pools are configured anywhere).
    # Sites never use proxy_set_header themselves (one at location level drops
    # every header set here); they switch values through the variables below.
    proxy_http_version 1.1;
    proxy_set_header Connection         $dalton_upstream_connection;
    proxy_set_header Upgrade            $dalton_upstream_upgrade;
    # ProxyPreserveHost On, and the X-Forwarded-* headers mod_proxy adds.
    proxy_set_header Host               $http_host;
    # X-Forwarded-For as mod_proxy sent it: the incoming chain with the client
    # last. The first entry (what rally-controller keys rate limits on) is the
    # same as under Apache, even when a CloudFront hop isn't in the trusted
    # list; the last is always the resolved client ($remote_addr).
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host   $http_host;
    proxy_set_header X-Forwarded-Server $hostname;
    proxy_set_header X-Forwarded-Proto  $dalton_forwarded_proto;
    proxy_connect_timeout 30s;
    proxy_read_timeout    30s;          # Timeout 30 (per-path `timeout=` → proxy_read_timeout)
    proxy_send_timeout    30s;
    # Apache streams responses as they arrive; so does dalton, so SSE and other
    # long responses are never held. X-Accel-Buffering from upstreams is ignored
    # for the same reason (nothing should switch buffering back on).
    proxy_buffering off;
    proxy_ignore_headers X-Accel-Buffering;
    # Header always unset X-Powered-By (which never removed an upstream's under
    # Apache; it does now).
    proxy_hide_header X-Powered-By;
    # Upstream connection failures answer 502/504 like mod_proxy (503 there).
    proxy_next_upstream off;

    # The incoming X-Forwarded-Proto passes through (the ALB sets it), unless a
    # site states the scheme with `set $dalton_forwarded_proto https;`.
    # (map variables are changeable, so `set` in a server or location overrides
    # the default; the same pattern carries the security headers.)
    map $http_x_forwarded_proto $dalton_forwarded_proto {
        default $http_x_forwarded_proto;
    }

    # No upgrade, and Connection: close, unless a location includes
    # snippets/websocket.conf (ProxyPass … upgrade=websocket). An empty Upgrade
    # value means the header isn't sent at all.
    map $host $dalton_upstream_connection { default "close"; }
    map $host $dalton_upstream_upgrade    { default ""; }
    map $http_upgrade $dalton_connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---------------------------------------------------------------- x-hs-api
    # CloudFront injects x-hs-api; any request without the right value is 403
    # (Apache: <If "req('x-hs-api') != osenv('HS_API_KEY')">).
    include /tmp/nginx/hs-api.conf;

    # ---------------------------------------------------------------- rate limits
    # Off unless RATE_LIMIT is dry-run or on (docker-entrypoint.sh renders the
    # zones). Never limited: private addresses (the ALB, other containers;
    # mod_evasive's DOSWhitelist), MCP endpoints (below), and locations that
    # include snippets/ratelimit-exempt.conf.
    geo $dalton_rl_exempt {
        default        0;
        127.0.0.0/8    1;
        10.0.0.0/8     1;
        172.16.0.0/12  1;
        192.168.0.0/16 1;
    }
    # MCP (/mcp on every vhost): claude.ai's MCP connector reaches every server
    # from a handful of shared egress addresses, so per-IP limits would
    # throttle all of its users together. The MCP servers authenticate each
    # call (OAuth bearer).
    map $uri $dalton_rl_exempt_path {
        "~^/mcp(?:/|$)" 1;
        default         0;
    }
    include /tmp/nginx/ratelimit.conf;

    # ---------------------------------------------------------------- headers
    include /etc/nginx/dalton/security-headers-defaults.conf;
    include /etc/nginx/snippets/security-headers.conf;

    # ---------------------------------------------------------------- ModSecurity
    modsecurity on;
    modsecurity_rules_file /etc/modsecurity/main.conf;

    # ---------------------------------------------------------------- OpenTelemetry
    include /tmp/nginx/otel.conf;     # rendered by docker-entrypoint.sh

    # ---------------------------------------------------------------- sites
    # The fleet's sites, one server{} (plus its upstream{} blocks) per file.
    # 001-default.conf there is the default_server that answers the ALB's
    # /healthcheck and any unknown Host.
    include /tmp/nginx/sites-enabled/*.conf;
}
